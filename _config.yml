# GitHub Pages runs Jekyll over this branch, and Jekyll's default exclude list contains node_modules - which is
# exactly where the playground's vendored packages live.
#
# Measured: node_modules/@lion/ui/exports/define/lion-button.js was present in the branch and 404 on the site, so
# the node demo's service worker had nothing to serve and the SSR demo could not load a component.
#
# Only node_modules is added back. An empty `exclude` also publishes it, but it makes Jekyll walk the entire tree:
# the vendored set is 21 MB across 22 packages and 1434 files, and that build failed outright (errored, "Page build
# failed"). Everything else keeps the default treatment, so the assets under assets/ (build.assets in
# astro.config.mjs) and the underscore rule that ate _astro/ are unaffected.
#
# Known limitation: @lion/ui is a symlink into packages/ui, which is not in this branch, so its own files still
# 404. The vendoring step has to copy rather than link for those to be served.
include:
  - node_modules
