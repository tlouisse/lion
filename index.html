<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lion portal — dark/light theme (PR #2878)</title>
<style>
  :root { color-scheme: light dark; --fg: light-dark(#111,#f5f5f5); --bg: light-dark(#fff,#0a0a0a); --muted: light-dark(#5a5a5a,#9a9a9a); }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  h1 { font-size:1.05rem; margin:0 0 4px; }
  p  { color:var(--muted); margin:0 0 16px; font-size:.85rem; }
  video { width:100%; max-width:1280px; border:1px solid var(--muted); border-radius:10px; display:block; }
  a { color:inherit; }
</style>
<h1>Lion portal — CSS-only dark/light theme</h1>
<p>Demo clip for <a href="https://github.com/ing-bank/lion/pull/2878">ing-bank/lion#2878</a>.
Light &rarr; pinned dark &rarr; pinned light &rarr; Auto (system) &rarr; system dark &rarr; pinned light &rarr; pinned dark.</p>
<video src="./demo/portal-dark-light-toggle.mp4" controls playsinline preload="metadata"></video>
</html>
